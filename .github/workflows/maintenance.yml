# Manual one-off: deactivate a plugin on concepts.manyproject.my (run from the Actions tab).
# Made by Many Project (Web App Marketing Sdn Bhd).
name: Deactivate a plugin
on:
  workflow_dispatch:
    inputs:
      plugin:
        description: Plugin folder to deactivate (e.g. seo-by-rank-math)
        required: true
env:
  SITE_HOST: concepts.manyproject.my
  SSH_HOST: 45.80.183.180
  SSH_PORT: "65002"
  SSH_USER: u110137743
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Deactivate
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          TARGET: ${{ inputs.plugin }}
        run: |
          case "$TARGET" in *[!a-z0-9._-]*|"") echo "Bad plugin name"; exit 1;; esac
          mkdir -p ~/.ssh && printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          for i in 1 2 3 4 5; do ssh-keyscan -T 15 -p "$SSH_PORT" "$SSH_HOST" > /tmp/kh 2>/dev/null && [ -s /tmp/kh ] && break; sleep $((i*5)); done
          cat /tmp/kh >> ~/.ssh/known_hosts
          for i in 1 2 3; do
            ssh -i ~/.ssh/deploy -p "$SSH_PORT" -o BatchMode=yes "$SSH_USER@$SSH_HOST" "bash -s" -- "$SITE_HOST" "$TARGET" <<'REMOTE' && exit 0
          set -eu
          HOST="$1"; T="$2"; WP=""
          for c in ~/domains/"$HOST"/public_html ~/domains/*/public_html; do
            [ -f "$c/wp-config.php" ] || continue
            u=$(wp option get siteurl --path="$c" --skip-plugins --skip-themes 2>/dev/null || true)
            case "$u" in *"$HOST"*) WP="$c"; break ;; esac
          done
          [ -n "$WP" ] || exit 1
          wp plugin deactivate "$T" --path="$WP"
          wp litespeed-purge all --path="$WP" >/dev/null 2>&1 || true
          wp plugin list --status=active --field=name --path="$WP"
          REMOTE
            sleep $((i*10))
          done
          exit 1
